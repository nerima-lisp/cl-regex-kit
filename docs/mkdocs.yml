site_name: cl-regex-kit
site_description: A from-scratch regular expression engine for Common Lisp, built on Thompson NFA construction and Pike's VM for linear-time matching
site_url: https://nerima-lisp.github.io/cl-regex-kit/
repo_url: https://github.com/nerima-lisp/cl-regex-kit
repo_name: nerima-lisp/cl-regex-kit
edit_uri: edit/main/docs/src/

docs_dir: src

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

# Every page under docs/src/ must appear here: --strict fails the build on an
# unlisted page.
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - Core concepts: concepts.md
  - Reference:
      - API: api-reference.md
      - Architecture: architecture.md
      - Compatibility: compatibility.md
  - Project:
      - Roadmap: roadmap.md

site_name: cl-regex-kit
site_description: A from-scratch Common Lisp regular expression engine with a Thompson NFA/Pike VM for regular patterns and a bounded AST executor for advanced constructs
site_url: https://nerima-lisp.github.io/cl-regex-kit/
repo_url: https://github.com/nerima-lisp/cl-regex-kit
repo_name: nerima-lisp/cl-regex-kit
edit_uri: edit/main/docs/src/

docs_dir: src
site_dir: ../site
use_directory_urls: true
strict: true
copyright: MIT

theme:
  name: material
  language: en
  favicon: assets/favicon.svg
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.smartsymbols
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      title: On this page

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guide:
      - Core Concepts: guide/core-concepts.md
  - Reference:
      - API: reference/api.md
      - Architecture: reference/architecture.md
      - Conditions: reference/conditions.md
      - Compatibility: reference/compatibility.md
      - Benchmarks: reference/benchmarks.md
  - Project:
      - Development: project/development.md
      - Roadmap: project/roadmap.md

not_in_nav: |
  notes/

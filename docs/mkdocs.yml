site_name: cl-regex-kit
site_description: A from-scratch regular expression engine for Common Lisp, built on Thompson NFA construction and Pike's VM for linear-time matching
site_url: https://nerima-lisp.github.io/cl-regex-kit/
repo_url: https://github.com/nerima-lisp/cl-regex-kit
repo_name: nerima-lisp/cl-regex-kit
edit_uri: edit/main/docs/src/

docs_dir: src

# Also passed as --strict by packages.docs. Writing it here as well means
# `mkdocs serve` applies the same gate, so no invocation path silently
# tolerates a broken link. Use `mkdocs serve --no-strict` while editing.
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

# Every page under docs/src/ must appear here: --strict fails the build on an
# unlisted page. docs/src/ is split into guide/ reference/ project/, with only
# index.md, getting-started.md and assets/ at the root, per the 2026-08-01
# revision of DOCS_STANDARD.md.
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - Core concepts: guide/concepts.md
  - Reference:
      - API: reference/api.md
      - Architecture: reference/architecture.md
      - Compatibility: reference/compatibility.md
  - Project:
      - Roadmap: project/roadmap.md

not_in_nav: |
  notes/

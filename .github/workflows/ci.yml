name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same PR; never cancel a push to the default
# branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job on purpose. Granularity belongs in the flake's `checks.*`
  # attributes, which `nix flake check` evaluates in parallel with build
  # caching. Splitting these into separate GitHub jobs would duplicate that
  # scheduling and lose cache sharing between them.
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # persist-credentials: false — this job runs untrusted PR code via
      # `nix flake check`, and never needs the token, so don't leave it in
      # .git/config for that code to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Runs the SBCL test suite (checks.default), the treefmt formatting gate
      # (checks.formatting), and the mkdocs --strict build (checks.docs).
      # --keep-going: without it, Nix cancels every other in-flight check as
      # soon as any one fails, so one broken check (e.g. checks.benchmark)
      # hides whether the test suite itself passed. This still exits
      # non-zero, and still fails the job, if any check fails.
      - name: Check flake
        run: nix flake check --keep-going --print-build-logs

      # Catches stray conflict markers and whitespace errors that compile fine.
      - name: Check diff hygiene
        run: git diff --check

      # Temporary: inspect the current coverage gap in detail. Remove once
      # analyzed; checks.coverage above is the permanent gate.
      - name: Coverage report (temporary diagnostic)
        if: always()
        run: nix develop --command sbcl --script run-coverage.lisp

      - name: Upload coverage report (temporary diagnostic)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 1
